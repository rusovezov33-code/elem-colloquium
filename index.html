"use strict";
const DATA = {"blocks": [["b0", "0. История и основные понятия"], ["b1", "1. Классификации элементов"], ["b2", "2. Биосфера и биогеохимия"], ["b3", "3. Дефицит/избыток = болезнь, стадии, коррекция"], ["b4", "4. Метаболизм: поступление, всасывание, синергизм/антагонизм, связи"], ["b5", "5. Элементный статус, биосубстраты, методы анализа"], ["b6", "6. Клинические вопросы (как на её слайдах)"], ["b7", "7. ⚠ Стоматология (может не входить)"]], "questions": [{"id": "el01", "block": "b0", "question": "Каких учёных называют основоположниками элементологии?", "answer": "Развитие знаний о химическом составе тела человека и значении элементов для здоровья связано с именами советских и российских учёных: В.И. Вернадского, А.П. Виноградова, А.И. Венчикова, В.В. Ковальского, Г.А. Бабенко, А.П. Авцына.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 4"}, {"id": "el02", "block": "b0", "question": "Кто такой В.И. Вернадский и какой его вклад в элементологию?", "answer": "В.И. Вернадский (12.03.1863–06.01.1945) — русский и советский учёный, естествоиспытатель, создатель многих научных школ, представитель русского космизма; интересы: геология, кристаллография, минералогия, геохимия, радиогеология, биология, биогеохимия, философия. В книге «Биосфера» впервые показал, что биосфера — закономерный результат развития планеты, её верхней области земной коры; живые организмы в биосфере — не случайные гости, а часть закономерной организованности.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 5–6"}, {"id": "el03", "block": "b0", "question": "Кто заведует кафедрой медицинской элементологии РУДН?", "answer": "Скальный Анатолий Викторович — д.м.н., профессор, основатель научного направления «Биоэлементология» и научной школы «Медицинская элементология»; председатель РОСМЭМ, вице-президент Института микроэлементов ЮНЕСКО и FESTEM.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 2"}, {"id": "el04", "block": "b0", "question": "Что такое биоэлементология и медицинская элементология?", "answer": "Биоэлементология — наука, изучающая роль и взаимодействие биоэлементов. Медицинская элементология — раздел биоэлементологии, изучающий биоэлементы в медицине.", "source": "PDF «Лекция №1», сл. 12", "flag": "Определение есть только в PDF «Лекция №1»; в офиц. лекции — постулаты биоэлемента (сл. 15)."}, {"id": "el05", "block": "b0", "question": "Дайте определение биоэлемента (постулаты).", "answer": "Биоэлемент — элементарная функционирующая единица живой материи, биологически активный комплекс химических элементов в виде атомов, ионов и наночастиц с органическими соединениями экзогенного (первичного) или биогенного (вторичного) происхождения. Биоэлементы — предшественники живой материи; удачное их сочетание (автокаталитические полимер-ионные реакции) приводит к образованию клеток.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 15"}, {"id": "el06", "block": "b0", "question": "Чем биоэлемент отличается от химического элемента?", "answer": "Хим. элемент присутствует в биосфере и за её пределами, вес и количество практически не ограничены, существует в 2000–3000 видах минералов; процессы образования инертной материи обратимы. Биоэлемент — в основном в биосфере (вне её существование временно или невозможно), вес и количество ограничены размером биосферы, существует в миллионах биологических соединений; новый биоэлемент появляется только из ранее существовавших (как живое — от живого), может создаваться и человеком (промышленный синтез, биотехнологии); процесс его формирования необратим во времени.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 20–23"}, {"id": "el07", "block": "b0", "question": "Как классифицируют биоэлементы (первичные/вторичные)?", "answer": "Первичные простые: структурные (C, H, N, O, P, S, Si, Ca), электролитические (K, Na, Ca, Cl, Mg), ферментативные (Mg, Fe, Zn, Cu, Mn, Co, Cr, Mo, Se, Sn, F, I, Ni, V, B), простые молекулы (H2O, O2, N2 и др.). Первичные сложные: нуклеиновые кислоты, полисахариды, белки и аминокислоты, липиды. Вторичные — сложные компоненты биоэлементных систем, «омы»: метаболом, металлом, липидом, протеом, геном, транскриптом.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 16–18", "flag": "Списки прочитаны с картинки слайда 17."}, {"id": "el08", "block": "b0", "question": "Какое место занимает биоэлементология среди наук? (4 позиции)", "answer": "На схеме «Положение биоэлементологии в комплексной системе наук» БЭ в центре и связана с аналитической и координационной химией, бионеорганической химией, радиобиологией и биофизикой, молекулярной биологией, физиологией, медициной, фармакологией, питанием растений и животных, пищевой промышленностью и др. То есть сразу 4 позиции: химия, физика, биология, медицина.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 25", "flag": "Подписи на схеме мелкие, прочитаны с картинки частично."}, {"id": "el09", "block": "b0", "question": "Каковы структурные уровни живой материи и где на них биоэлементы?", "answer": "Схема (Ю.Н. Орлов, 2009, с доп. А.В. Скального): существо — вещество/поле — молекулы — атомы — ядра — адроны — фундаментальные частицы (кварки, лептоны, переносчики взаимодействий). Биоэлементы находятся на границе макро- и микромира — на уровне вещества и молекул.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 24", "flag": "Схема прочитана с картинки."}, {"id": "el10", "block": "b1", "question": "Классификация элементов по содержанию в организме (химическая).", "answer": "Определение: делят по % от массы тела. Макроэлементы: n·10⁰ (1–9%) Ca; n·10⁻¹ (0,1–0,9%) P, K, Na, S, Cl; n·10⁻² (0,01–0,09%) Mg. Микроэлементы: n·10⁻³ Fe, Zn, F, Mo, Cu, Sr; n·10⁻⁴ Mn, I, Al, Br, Si, Cs; n·10⁻⁵ Pb, Cd, B, Rb. Ультрамикроэлементы: n·10⁻⁶ и ниже — Se, Cr, Co, V, As, Hg, Ni, Li, Sn, Be, Ba, Ti, Ag, Ga, Ge, Sc, Zr, Bi, Sb, U, Th, Rh. (Позиция химии.)", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 31; PDF «Лекция №1», сл. 5"}, {"id": "el11", "block": "b1", "question": "Сколько элементов в организме и какова доля органогенов, макро- и микроэлементов?", "answer": "В организме около 70–75 химических элементов. Органогены (O, H, C, N) — 98%; макроэлементы (Na, K, Ca, P, Mg, S) — 1,9%; микро- и ультрамикроэлементы (Fe, Cu, Zn, Se, I, Mn, Mo, Co, V, Cr и др.) — 0,1%. А.П. Виноградов указывал на возможность наличия в организме всех известных элементов и их изотопов; если какой-то не найден — это несовершенство методов.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 26"}, {"id": "el12", "block": "b1", "question": "Состав организма человека в % массы тела (по Лекции №1).", "answer": "O 65%, C 18%, H 10%, N 3%; минералы 4%; микроэлементы 0,05%. Ca 1,7; P 1,25; S 0,3; Mg 0,25; K 0,25; Na 0,2; Cl 0,2; F 0,02; Fe 0,006; Zn 0,0033; Cu, I, Mn, Co, Mo, Se — 0,0005.", "source": "PDF «Лекция №1», сл. 4", "flag": "Цифры только в доп. PDF; в офиц. лекции — 98% / 1,9% / 0,1% (сл. 26)."}, {"id": "el13", "block": "b1", "question": "Где в таблице Менделеева расположены биогенные элементы?", "answer": "99,9% массы тела представлены 11 химическими элементами; 9 из 11 — элементы первых 3-х периодов, K и Ca — первые 2 элемента 4-го периода. Биогенные элементы (кроме Mo, I, Sn) — элементы 4-го периода. F и Si — элементы 2-го и 3-го периодов. Далее на слайдах выделены группы: O, C, N, H; Si, P, S; F, Cl, Br, I; Na, K, Ca, Mg; Li, Be, Rb, Sr, Cs, Ba; V, Cr, Mn, Fe, Co, Ni, Cu, Zn (+Mo).", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 27–30", "flag": "Текст и подсветка прочитаны с картинок слайдов."}, {"id": "el14", "block": "b1", "question": "Классификация элементов по функциям по А.П. Авцыну.", "answer": "Классификация по функциям в живом организме (А.П. Авцын с соавт.): 1) эссенциальные (жизненно важные): Fe, Cu, Zn, Mn, Cr, Se, Mo, I, Co; 2) условно эссенциальные: As, B, Br, F, Li, Ni, Si, V; 3) токсичные: Al, Cd, Pb, Hg, Be, Ba, Bi, Tl. (Позиция биологии/мед. элементологии.)", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 32; PDF «Лекция №1», сл. 6", "flag": "В офиц. лекции последний токсичный — «Ti», в Лекции №1 — «Tl» (таллий). Вероятно, опечатка; уточнить."}, {"id": "el15", "block": "b1", "question": "Классификация ВОЗ 1996 года.", "answer": "Классификация по роли в живом организме (WHO, 1996): 1) эссенциальные: Fe, Cu, Zn, Cr, Se, Mo, I; 2) условно эссенциальные: Mn, B, Ni, Si, V; 3) токсичные (в Лекции №1 — «условно токсичные»): F, As, Al, Cd, Pb, Hg, Li, Sn. Отличие от Авцына: Mn и Co не в эссенциальных, F и Li — в токсичных.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 33; PDF «Лекция №1», сл. 7", "flag": "Название 3-й группы различается: офиц. — «токсичные», Лекция №1 — «условно токсичные»."}, {"id": "el16", "block": "b1", "question": "Критерии эссенциальности по E. Underwood (1962).", "answer": "1) Увеличение содержания микроэлемента в пище стимулирует рост и развитие. 2) Снижение содержания в пище приводит к клиническим проявлениям дефицита, которые исчезают при введении элемента в пищу. 3) Сильная корреляция между низким содержанием в ткани и клиническими проявлениями дефицита.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 34; PDF «Лекция №1», сл. 9"}, {"id": "el17", "block": "b1", "question": "Критерии эссенциальности по Д. Арнону и Дж. Котциасу.", "answer": "Арнон: при недостатке элемента организм не может нормально расти или завершить жизненный цикл; недостаток специфичен и устраняется только внесением этого элемента; элемент выполняет определённую метаболическую функцию. Котциас: присутствие во всех здоровых тканях; небольшие различия в содержании у разных видов; лишение элемента вызывает чётко воспроизводимые морфологические, физиологические и биохимические изменения, сходные у разных видов; эти изменения предупреждаются или излечиваются восполнением элемента.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 34"}, {"id": "el18", "block": "b1", "question": "Шкала оценки эссенциальности (Underwood 1971, Krock 1976, Williams 1976).", "answer": "Баллы от 9 до 1: 9 — H, C, N, O, Mg, K, Ca, Na, P, Cl, S, Zn, Cu, Fe, Mn, Mo, I; 8 — Se, Cr, Ni, V; 7 — Si; 6 — F, Sn; 5 — Sr; 4 — Li; 3 — La, Nb, Sc; 2 — Rb, Ba, As; 1 — Ce, Dy, Ho, Y, Ti, Ag, Cd, Pb, Tl, Sb, Ga. Группы: essential / potentially essential / foreign.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 35; PDF «Лекция №1», сл. 8", "flag": "Таблица прочитана с картинки."}, {"id": "el19", "block": "b2", "question": "Что такое биосфера?", "answer": "Биосфера — область существования и функционирования живых организмов, включающая атмосферу, гидросферу, террабиосферу и верхние слои литосферы. Это активная оболочка Земли, включает и живые организмы, и окружающую среду; наибольшая экосистема Земли (подсистемы: экосистемы земли, океана, верхней литосферы, нижней атмосферы); характеризуется высоким уровнем биотического метаболизма.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 7"}, {"id": "el20", "block": "b2", "question": "Что такое биогеохимические провинции?", "answer": "Структура Земли разнородна: есть области с повышенными или пониженными концентрациями некоторых микроэлементов или их соединений — их назвали биогеохимическими провинциями. Геологическая и аграрная активность человека изменила биосферу, сделав её не оптимальной для жизни.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 8"}, {"id": "el21", "block": "b2", "question": "Что такое антропобиогеохимические провинции? Какие загрязнители выделяют?", "answer": "Химические элементы неравномерно распределены в среде. Техногенная активность человека изменяет химический состав среды, формируя антропобиогеохимические провинции. Отрицательно влияющие соединения: пестициды, компоненты удобрений, радионуклиды, токсичные микроэлементы (Hg, Cd, Pb, Tl, As).", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 11"}, {"id": "el22", "block": "b2", "question": "Каков биологический ответ организмов на изменение геохимических факторов?", "answer": "Устойчивость (адаптация); образование новых видов; эндемические заболевания; тератогенез и смерть. Последние возможны при остром дефиците или избытке элементов в окружающей среде.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 9"}, {"id": "el23", "block": "b2", "question": "Как элементы попадают из среды в организм (пищевые цепи)?", "answer": "Накопление элементов определяется биологической природой, геохимией и пищевыми цепями, объединяющими среду и организм. Элементы попадают преимущественно с питьевой водой и пищей; исключения: Si (ингаляция), I (ингаляция в прибрежных зонах и на островах). Поступление с пищей зависит от пищевых привычек и доступности (например, морепродуктов) — это влияет на ежедневный элементный баланс.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 10"}, {"id": "el24", "block": "b2", "question": "Чем отличается элементный состав морских и материковых организмов?", "answer": "Морская флора и фауна богата Ca, K, Na, Mg, S, Cl, O, Zn, Cu, Mn (на слайде «Mu»), Fe, I, Ni, Ti, Sr, Zr, Cr, Li, B, La. Материковые растения и животные содержат меньше минеральных веществ, однако концентрация Mn и Al в материковой флоре и фауне превышает уровень морских более чем в 10 раз; материковые растения и животные — основной резервуар макроэлементов, но бедный ресурс Cr, Mn, V, играющих роль в регуляции инсулиновой сигнализации.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 11", "flag": "Мелкий текст на картинке слайда, прочитан визуально."}, {"id": "el25", "block": "b3", "question": "Для чего нужно изучать медицинскую элементологию? (дефициты в мире)", "answer": "Дефициты эссенциальных микроэлементов в мире (Biesalski 1999, Oberleas 2002), млрд людей: Fe до 1,0; I до 1,0; Se до 1,0; Cr до 3,0; Cu 3,6–3,8; Zn до 4,5. Вывод: дефицит эссенциальных элементов = болезнь; избыток токсических элементов = болезнь.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 12; PDF «Лекция №1», сл. 11"}, {"id": "el26", "block": "b3", "question": "Назовите степени (стадии) дисбаланса биоэлементов I–IV.", "answer": "I — несбалансированное питание; II — дезадаптация: дисбаланс химических элементов в организме; III — «предболезнь»: снижение функциональных резервов; IV — болезнь: ограничение жизнедеятельности. Для профилактики и лечения важно контролировать и корректировать начальные дисбалансы, вызванные неоптимальным питанием, экологией, стрессом и т.д.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 51–52; PDF «Лекция №1», сл. 28"}, {"id": "el27", "block": "b3", "question": "Как корректируют нарушения элементного статуса на стадиях 1–2 и 3–4?", "answer": "Отклонения в волосах делят на 4 этапа (выбраны эмпирически). Стадии 1–2 — преморбидные или функциональные нарушения: коррекция диетой (оптимизация питания, пре- и пробиотики, ферменты, обогащённые продукты, природные источники микроэлементов, БАД), оптимизация лечения препаратами, лечение дисфункций ЖКТ, мочеполовой и эндокринной систем, уменьшение контакта с вредными проф. и средовыми факторами. Стадии 3–4 — углублённое клинико-лабораторное обследование; коррекция не только нутрицевтическая, но и лечение и профилактика агентами, регулирующими элементный гомеостаз.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 79; PDF «Лекция №2», сл. 48"}, {"id": "el28", "block": "b3", "question": "На какие группы делят болезни дисбаланса элементов?", "answer": "На две группы: приобретённые и генетически обусловленные. По ходу курса изучается несколько десятков таких заболеваний.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 53"}, {"id": "el29", "block": "b3", "question": "Назовите болезни, связанные с железом, медью и цинком.", "answer": "Fe: латентный дефицит железа, железодефицитная анемия, анемия воспаления (хронических заболеваний), гемохроматоз, неонатальный гемохроматоз, ацерулоплазминемия, медь/марганец-зависимая ЖДА, гипотиреоз. Cu: болезнь Вильсона–Коновалова, болезнь Менкеса, медь/марганец-зависимая ЖДА, витилиго. Zn: алкогольная эмбриофетопатия, энтеропатический акродерматит, болезнь Прасада.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 54"}, {"id": "el30", "block": "b3", "question": "Назовите болезни, связанные с Mn, Mo, Hg.", "answer": "Mn: марганизм, гипераммониемия. Mo: дефицит кофактора молибдена (Moco), изолированный дефицит ксантиноксидазы (ксантинурия 1 и 2 типа), подагра. Hg: меркуриализм, болезнь Минамата.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 54"}, {"id": "el31", "block": "b3", "question": "Назовите болезни, связанные с Se, I, Co, Si, Pb, Cd, As.", "answer": "Se: болезнь Кешана, болезнь Кашина–Бека, селеноз, гипотиреоз. I: гипотиреоз, диффузный токсический зоб (Базедова болезнь, болезнь Грейвса), кретинизм. Co: мутация транспортера MMACHC, метилмалоновая ацидурия, семейная гипергомоцистеинемия. Si: силикоз. Pb: анемия при интоксикации свинцом, сатурнизм. Cd: болезнь Итай-Итай. As: болезнь чёрных стоп.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 55"}, {"id": "el32", "block": "b3", "question": "Какие стратегии решения проблемы обеспеченности биоэлементами существуют?", "answer": "Медицинская и фармацевтическая: + персонализированная медицина, инновации в диагностике и фармацевтике; − дорого, 5–10 лет для страны. Нутритивная: + естественный путь, массовость (2–5 лет), модернизация пищепрома; − нет индивидуального подхода, нужно обследовать население. Сельскохозяйственная: + вовлечение фермеров, рынок органической еды, инновации в агрохимии; − смена мышления фермеров, нужна господдержка, 5–10 лет. Обогащённые агропродукты — самый «физиологичный» путь, но долгий.", "source": "PDF «Лекция №1», сл. 32–35", "flag": "Только в доп. PDF «Лекция №1»; в офиц. лекции этого нет."}, {"id": "el33", "block": "b3", "question": "Какие элементы относят к жизненно важным и токсичным при оценке здоровья?", "answer": "На слайде «Оценка состояния здоровья» токсичные элементы: Al, Sn, Cd, Pb, Hg, As — в противовес жизненно важным.", "source": "PDF «Лекция №1», сл. 30", "flag": "Только в доп. PDF."}, {"id": "el34", "block": "b4", "question": "Пути поступления и выведения элементов.", "answer": "Поступление: алиментарный, ингаляционный, транскутанный и трансмукозный, трансплацентарный, парентеральный. Выведение: мочевыделительная система, ЖКТ, ингаляционный путь, кожа и волосы, другие биожидкости (слюна, сперма, ликвор, слёзная жидкость и др.).", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 36"}, {"id": "el35", "block": "b4", "question": "Что должен оценить врач, оценивая баланс элементов?", "answer": "Основной путь поступления — алиментарный: оцениваем рацион и составляем его с учётом синергизма и антагонизма нутриентов. Состояние ЖКТ: кислотность желудка, желчеотток, пищевые ферменты, моторика, заболевания ЖКТ, микробиота. Гомеостаз, прежде всего белковый обмен (белок транспортирует элементы; при его нарушении баланс нарушается). Значение имеют возраст, особые состояния (беременность, спорт, диеты), сопутствующие заболевания, семейный анамнез.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 37"}, {"id": "el36", "block": "b4", "question": "Органические ингибиторы и стимуляторы всасывания элементов.", "answer": "Ингибиторы: фитиновая кислота и её соли, некоторые пищевые волокна, лекарственные средства. Стимуляторы (в физиологических концентрациях): витамин С, лимонная, молочная, пировиноградная, янтарная кислоты, лактоза, фруктоза, глюкоза, гистидин, лизин, цистеин, валин.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 38"}, {"id": "el37", "block": "b4", "question": "Фитиновая кислота: где содержится, чем вредна, как нейтрализовать?", "answer": "Содержится в бобовых, орехах, крупах; больше — в продуктах с высокофосфатными удобрениями. Ухудшает усвоение F, Fe, Zn, Ca, P; замедляет ферменты поджелудочной; избыток ведёт к минеральной недостаточности (остеопороз, нарушения пищеварения, анемия); 5–10 мг фитиновой кислоты снижают поглощение железа на 50%. Здоровая микрофлора вырабатывает расщепляющий её фермент. Нейтрализация: замачивание 8–12 ч в тёплой кислой среде (уксус, лимон, молочнокислые бактерии, сок квашеной капусты); снижает фитаты в нуте на 31–40%, в фасоли на 25–32%.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 39–41"}, {"id": "el38", "block": "b4", "question": "Дайте определения синергизма и антагонизма элементов.", "answer": "Синергисты: а) взаимно стимулируют абсорбцию в ЖКТ; б) положительно взаимодействуют при реализации метаболической функции на тканевом и клеточном уровнях. Антагонисты: а) взаимно снижают абсорбцию в ЖКТ; б) избирательно влияют на биохимические функции. Синергизм обычно взаимен, антагонизм может быть взаимным или односторонним. Уровни: ЖКТ и метаболизм; одна пара может вести себя по-разному на разных уровнях.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 42–43"}, {"id": "el39", "block": "b4", "question": "Примеры синергизма на уровне ЖКТ и клеточного метаболизма.", "answer": "ЖКТ: прямое взаимодействие ионов (Ca и P, Na и Cl, Zn и Mo); модуляция кишечных ферментов (P, Zn, Co). Клеточный уровень: P и Ca — формирование костей; Fe и Cu — образование гемоглобина; Mn и Zn — синтез РНК; Mo и Fe — ксантин- и альдегидоксидазы, Fe и Cu — цитохромоксидаза; активация синтеза Mg²⁺ с вовлечением P, S; гормоны: йод → тиреоидные гормоны → рост метаболизма → кумуляция K и Mg.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 44"}, {"id": "el40", "block": "b4", "question": "Объясните взаимодействие железа и меди на этапах ЖКТ и метаболизма.", "answer": "В ЖКТ Fe и Cu — антагонисты: избыток железа нарушает абсорбцию меди, поэтому препараты Fe и Cu принимают в разное время. В метаболизме — синергисты: только при участии медь-зависимой ферроксидазы (церулоплазмина) железо меняет валентность (Fe²⁺ → Fe³⁺) и участвует в синтезе гемоглобина. При дефиците меди возможна медь-зависимая железодефицитная анемия.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 45"}, {"id": "el41", "block": "b4", "question": "Назовите основные антагонистические пары элементов.", "answer": "Таблица (элемент → его антагонисты): Ca — P, Al, Zn, Mg, Pb; P — Ca, Mg, Mn, As; Mg — Ca, F, Be; Na — K, Li; S — Se, Zn; Fe — Mn, Cu, Co, Zn, Pb; Mn — Cu, P, Fe, Co, Mg; Zn — Fe, Ca, Cu, Pb, Cd; Cu — S, Ag, Cu, Fe, Mo, P, Cd, Zn; Mo — W, S, Cu, Mn; Cd — Zn, Cu, Fe, Hg, Pb, Se; F — Al, Ca, Mg; Co — Fe; Cr — Zn, V; I — Co, Mn, Pb; Sn — Fe, Cu; Se — S, As, Hg, Cd, Ag, Pb, Au.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 46", "flag": "Таблица на картинке, прочитана визуально; Cu в столбце Cu так и стоит на слайде."}, {"id": "el42", "block": "b4", "question": "Как элементы связаны с белками?", "answer": "От четверти до трети всех белков содержат ионы металлов или требуют их для максимальной активности (система белок–металл: металлопротеины и металлоферменты, белки, активируемые металлами). Функции: транспорт и хранение O₂ (гемоглобин, миоглобин); перенос электронов (железосерные белки, цитохромы, медьсодержащие белки); транспорт и хранение металлов (альбумин, трансферрин, лактоферрин, церулоплазмин, ферритин).", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 47"}, {"id": "el43", "block": "b4", "question": "Как элементы связаны с витаминами?", "answer": "Элемент может влиять на всасывание, активацию, утилизацию витамина или быть его структурной частью; витамин может влиять на транспорт элемента в клетку. Пары: Zn — вит. A; Se — вит. E; Co — вит. B12; Mg — вит. B6; вит. D — Mg, Ca и P.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 48"}, {"id": "el44", "block": "b4", "question": "Как элементы связаны с гормонами?", "answer": "Инсулин способствует проникновению K в клетку; Zn входит в состав тестостерона и инсулина; минералокортикоиды влияют на обмен Na и K; кальцитонин — на обмен Ca; паратгормон — на Ca и P; Cu активирует рецепторы эстрогенов, рецептор эстрогена содержит два атома Zn; I входит в гормоны щитовидной железы.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 49"}, {"id": "el45", "block": "b4", "question": "Как лекарства влияют на баланс элементов?", "answer": "Антациды снижают абсорбцию фосфатов, F, Fe, Mg. Литий на фоне дефицита Na — интоксикация литием. Сердечные гликозиды усиливают выведение K, Ca, Mg, Zn; их токсичность выше при дефиците Ca и Mg. Контрацептивы повышают Cu и Fe. Длительный приём Fe снижает абсорбцию Zn и Cu. Кортикостероиды снижают Co, Mg, Zn. Калийсберегающие диуретики — гипернатриемия и гиперкалиемия. Тиазидные — выведение K, Mg, Zn, Na, задержка Ca. Врач учитывает это при назначении терапии.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 50"}, {"id": "el46", "block": "b4", "question": "Какие внутренние факторы влияют на биодоступность микроэлементов?", "answer": "Возраст: в раннем детстве постнатальная абсорбция Cr, Fe, Zn и, возможно, Pb регулируется слабо; при старении снижается абсорбция Cu и Zn. Гомеостатическая регуляция: адаптация к снижению всасывания или повышенной потребности (беременность) изменением активности и количества транспортёров (Cr, Cu, Mn, Zn; возможно, не для F, I, Pb, Se); насыщение рецепторов.", "source": "PDF «Лекция №2», сл. 6", "flag": "Только в доп. PDF «Лекция №2»."}, {"id": "el47", "block": "b5", "question": "Что такое оценка элементного статуса и для чего она нужна?", "answer": "Оценка элементного статуса — основной инструмент анализа влияния дефицита, избытка или изменённого распределения элементов на здоровье; это спектр химических элементов одновременно в нескольких биосубстратах. Проводится прямым анализом содержания элементов в органах и тканях или оценкой элемент-специфических биохимических реакций. Главный вопрос анализа — выбор подходящих биосубстратов и методов.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 64, 67"}, {"id": "el48", "block": "b5", "question": "Для каких целей используют оценку элементного статуса?", "answer": "Мониторинг здоровья и эффективности лечения; формирование групп риска гипо- и гиперэлементозов; скрининг больших когорт; подбор диеты; территориальные карты риска для детей и других групп; оценка системы «человек — окружающая среда»; экологические карты территорий; влияние привычек на здоровье детей и родителей; судебно-криминалистические исследования.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 65"}, {"id": "el49", "block": "b5", "question": "Почему нужен анализ минимум в 2 биосубстратах?", "answer": "Для объективной оценки нужен анализ как минимум в 2 биосубстратах: волосы показывают изменения, существующие длительное время; цельная кровь / сыворотка / плазма — текущее состояние организма.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 66"}, {"id": "el50", "block": "b5", "question": "Что показывают волосы/ногти, кровь и моча?", "answer": "Волосы/ногти: процессы, длительно протекающие; многоэлементный анализ (видна общая картина и соотношения пар элементов); элементный состав волос не регулируется гомеостатически — ранний признак дисфункции на доклинических стадиях. Кровь: инвазивный метод, текущее состояние, изменения видны при острых срывах компенсации; цельная кровь — токсичные металлы, сыворотка/плазма — эссенциальные и макроэлементы. Моча: оценка пути выведения и избыточного накопления тяжёлых металлов.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 68–70, 74"}, {"id": "el51", "block": "b5", "question": "Жидкие и плотные биосубстраты — в чём разница?", "answer": "Наиболее информативны органы и ткани, участвующие в распределении и накоплении элементов. Жидкие ткани (кровь, моча) отражают краткосрочную экспозицию и высоко изменчивы. Плотные ткани (волосы, ногти, кости) отражают статус за длительный период (месяцы).", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 71"}, {"id": "el52", "block": "b5", "question": "Сравните кровь, мочу и волосы как образцы.", "answer": "Сбор: кровь — инвазивный, моча и волосы — неинвазивный. Квалификация: для крови нужен специалист. Хранение/транспорт: кровь и моча — заморозка, волосы — комнатная температура. Минерализация: низкая / низкая / высокая. Отражение статуса: кровь и моча — непродолжительный период, волосы — продолжительный. Риск внешнего загрязнения: низкий / средний / высокий. Гомеостатический контроль: высокий / высокий / низкий.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 72", "flag": "Таблица прочитана с картинки."}, {"id": "el53", "block": "b5", "question": "Как готовят пробу волос для анализа?", "answer": "Берут сухие волосы (или ногти) 0,1 г; помещают в тефлоновые тубы с 2 мл концентрированной азотной кислоты; нагревают до 115 °C до полного растворения; после охлаждения доводят бидистиллированной водой до 10 мл; трубку переносят в аналитический блок. Важно избегать загрязнения на всех этапах.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 73–74"}, {"id": "el54", "block": "b5", "question": "Какие методы разложения пробы для ИСП-МС существуют?", "answer": "Два: а) кислотное растворение в открытых тубах (высокая производительность, но не для проб с большим количеством жиров, потеря летучих As, Hg, I, Se, матричные помехи); б) кислотное разложение «мокрое озоление» в микроволновых системах (высокая производительность, полное окисление матрицы, меньше потерь летучих). Микроволновое: нагрев до 200 °C 5 мин, 200 °C, охлаждение до 45 °C, доведение до 10 мл; вносят внутренний стандарт.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 76–77"}, {"id": "el55", "block": "b5", "question": "Назовите методы анализа химических элементов и их особенности (позиция физики).", "answer": "ААС — >70 элементов, высокая специфичность, но моноэлементный. ИСП-АЭС — многоэлементный, для скрининга, есть спектральные помехи. ИСП-МС — многоэлементный, наиболее перспективный для микро- и ультрамикроэлементов, пределы <0,01 мкг/л, изотопы; дорого. Ионная хроматография — 0,1 мкг/л. Полярография — дешёвая. НАА — научный, подтверждающий, без разрушения, дорогой. Спектрофотометрия — дешёвая. Рентгенофлуоресцентная спектрометрия — многоэлементная, медицинское применение ограничено.", "source": "PDF «Лекция №2», сл. 30–37", "flag": "Методов нет в офиц. лекции (там только пробоподготовка к ИСП-МС, сл. 76–78)."}, {"id": "el56", "block": "b5", "question": "Как оценивают элементный статус по биохимическому анализу крови (ферменты)?", "answer": "Зная, от каких элементов зависят ферменты, можно предполагать дисбалансы. Дефицит Zn влияет на Zn-зависимые карбоангидразу, щелочную фосфатазу, карбоксипептидазу. Отравление Pb — нарушение метаболизма порфирина, гипохромная анемия, анизоцитоз. Se-статус — по активности глутатионпероксидазы или интенсивности окислительного стресса. ЩФ понижена: дефицит Zn, Mg, анемия при дефиците фолатов и B12, избыток вит. D, дефицит вит. C, гипотиреоз, гипопаратиреоз, недостаток B6, глютеновая болезнь, гипофосфатазия; повышена: дефицит Ca или P, передозировка вит. C, холестаз, заболевания печени.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 59–61", "flag": "Схема ЩФ (сл. 60) прочитана с картинки."}, {"id": "el57", "block": "b6", "question": "Назовите этапы диагностики дисбаланса элементов.", "answer": "1) Жалобы, анамнез заболеваний, наследственный анамнез. 2) Внешний вид пациента. 3) Рутинные лабораторные исследования — клинический и биохимический анализ крови. 4) Инструментальные исследования. 5) Консультации специалистов (офтальмолог, невролог, кардиолог, эндокринолог, гепатолог, гастроэнтеролог и др.). 6) Исследование сред на содержание элементов. 7) При наследственной причине — генетический анализ.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 56"}, {"id": "el58", "block": "b6", "question": "К вам в кабинет зашёл пациент. Какие признаки дефицита вы оцените при осмотре?", "answer": "На слайде: сухость и шелушение кожи, ранняя седина, плохое заживление ран, ломкость ногтей, витилиго, бледность кожи, алопеция, белые точки на ногтях. По таблице (сл. 58): алопеция — Mg, Zn; изменённая пигментация кожи — Cu; витилиго — болезнь, связанная с Cu (сл. 54); бледность — анемия (Fe, сл. 54).", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 57–58, 54", "flag": "На сл. 57 элементы к картинкам не подписаны. Связки взяты из сл. 58 и 54; для остальных признаков ответа на слайдах нет."}, {"id": "el59", "block": "b6", "question": "Признаки дефицита Zn, Se, Mg, Cu по таблице симптомов.", "answer": "Zn: частые простуды, герпес, фертильная дисфункция, аллергия, грибковые и воспалительные заболевания кожи, псориаз, повышенные глюкоза и холестерин, алкоголизм, алопеция, задержка роста и развития. Se: частые простуды, герпес, сердечно-сосудистая и нервная астения, атеросклероз, ожирение, мужское бесплодие, катаракта. Mg: алопеция, атеросклероз, ожирение. Cu: сколиоз, изменённая пигментация, атеросклероз, ожирение, женское бесплодие, диабет.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 58; PDF «Лекция №2», сл. 41"}, {"id": "el60", "block": "b6", "question": "Признаки дефицита Mn, K, Co, Ca, Cr по таблице симптомов.", "answer": "Mn: аллергический ринит, заболевания опорно-двигательного аппарата, избыточный вес, задержка психического развития. K: воспалительные и аллергические заболевания кожи и слизистых. Co: сниженная адаптация к физическим нагрузкам, астения, нарушение памяти и внимания, задержка роста. Ca: аллергия, остеопороз, нарушение функции почек, поджелудочной и щитовидной железы, кровоизлияния. Cr: частые простуды, герпес, атеросклероз, ожирение, диабет, мужское бесплодие.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 58"}, {"id": "el61", "block": "b6", "question": "Какие изменения в клиническом и биохимическом анализе крови могут говорить о дисбалансе элементов?", "answer": "Клинический: анемия и её характер (макро- или микроцитарная), лейкопения, тромбоцитопения, лимфопения. Биохимический: белковый, жировой, углеводный обмен, работа почек, ферменты; зная, от каких элементов зависят ферменты (ЩФ, карбоангидраза — Zn; глутатионпероксидаза — Se), предполагают дисбаланс. При оценке учитывают возрастные нормы и нормы для беременных.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 59–61"}, {"id": "el62", "block": "b6", "question": "Какие дисбалансы врач может заподозрить по ЭКГ, денситометрии, рентгену, УЗИ?", "answer": "Это задание со слайда без готового ответа. Из того, что есть в лекции: денситометрия/рентген (кость) — Ca и P (синергизм при формировании костей; паратгормон, кальцитонин; остеопороз при дефиците Ca и при избытке фитатов); ЭКГ — K, Mg, Ca (инсулин и K; минералокортикоиды — Na, K; сердечные гликозиды и диуретики выводят K, Mg, Ca); УЗИ щитовидной железы — I и Se (гипотиреоз, зоб), УЗИ печени — Cu, Fe (болезнь Вильсона–Коновалова, гемохроматоз).", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 62 (задание); связи по сл. 39, 44, 49, 50, 54–55, 58", "flag": "⚠ На слайде ответа нет — это сопоставление по другим слайдам, а не её формулировка."}, {"id": "el63", "block": "b6", "question": "Что может увидеть офтальмолог при дисбалансе элементов?", "answer": "На слайде консультаций: осмотр офтальмолога — кольцо Кайзера–Флейшера. Специалисты (офтальмолог, невролог, кардиолог, эндокринолог, гепатолог, гастроэнтеролог) могут увидеть признаки дисбаланса определённых элементов и поставить диагноз.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 63", "flag": "Связь кольца с медью (болезнь Вильсона–Коновалова, сл. 54) на слайде не подписана."}, {"id": "el64", "block": "b6", "question": "Пациент принимает препараты железа длительно. Что учесть?", "answer": "Длительный приём Fe снижает абсорбцию Zn и Cu (сл. 50); Fe и Cu — антагонисты в ЖКТ, поэтому препараты Fe и Cu принимают в разное время (сл. 45).", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 45, 50"}, {"id": "el65", "block": "b6", "question": "Пациент на тиазидных диуретиках / сердечных гликозидах — какие дисбалансы ждать?", "answer": "Тиазидные диуретики: усиленное выведение K, Mg, Zn, Na; задержка Ca. Сердечные гликозиды: усиливают выведение K, Ca, Mg, Zn; токсичность препарата растёт при дефиците Ca и Mg.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 50"}, {"id": "el66", "block": "b6", "question": "Пациент-вегетарианец ест много бобовых и круп. Какой риск и что посоветовать?", "answer": "Фитиновая кислота (бобовые, орехи, крупы) ухудшает усвоение F, Fe, Zn, Ca, P; избыток — минеральная недостаточность, остеопороз, анемия. Совет: замачивание 8–12 ч в тёплой кислой среде (нут −31–40%, фасоль −25–32% фитатов); стимуляторы всасывания — вит. С, органические кислоты.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 38–41", "flag": "Сам кейс (вегетарианец) — мой пример, факты со слайдов."}, {"id": "el67", "block": "b7", "question": "Дисбалансы каких элементов влияют на стоматологическую заболеваемость? Норма фтора в воде.", "answer": "Дисбалансы Ca, P, F, B, Cu, Zn, избыток Cd, Pb и других тяжёлых металлов. Флюороз в разных формах. Фториды в питьевой воде — не менее 0,25 и не более 1,1 мг/л; во время развития зубов и после прорезывания это формирует кариесовосприимчивость.", "source": "PDF «Мед. элементология в стоматологии», сл. 10", "flag": "⚠ Стоматологический файл — не официальная лекция; входит ли в коллоквиум, неизвестно."}, {"id": "el68", "block": "b7", "question": "Почему кариес называют полиэлементозом?", "answer": "Кариес — полиэлементоз, требующий комплексного лечения: нормализация водно-солевого и фосфорно-кальциевого обмена, иммунной и антиоксидантной систем. При кариесе снижено содержание P и Cr в волосах и слюне, Zn в волосах, K, Na, Ca, Se, Mn в слюне; повышено Al, As, Pb, Sr, Sn, B, V, Si, Mg, Co, Cu в волосах и слюне.", "source": "PDF «Мед. элементология в стоматологии», сл. 19", "flag": "⚠ Выводы из диссертации на слайде, не официальная лекция."}, {"id": "el69", "block": "b7", "question": "Почему слюну используют для оценки элементного статуса в стоматологии?", "answer": "Смешанная слюна — индикатор созревания и минерализации твёрдых тканей зубов. Преимущества: простота хранения и пробоподготовки, неинвазивность, широкий спектр показателей (40 элементов); слюна выполняет реминерализующую функцию.", "source": "PDF «Мед. элементология в стоматологии», сл. 14", "flag": "⚠ Стоматологический файл."}, {"id": "el70", "block": "b7", "question": "Применение цинка, натрия и железа в стоматологии.", "answer": "Zn: глюконат, аспарагинат, пиколинат — в пастах и ополаскивателях; соли Zn эффективны против зубного налёта и микробной биоплёнки; ацизол снижает воспаление пародонта и кровоточивость. Na: 0,9% NaCl — дезинтоксикация и промывание слизистой, 3–5% — очищение ран, 10% — полоскания при заболеваниях горла. Fe: препараты при ЖДА; клиника — алебастровая бледность, извращение вкуса, атрофия слизистой, ярко-красные пятна на языке.", "source": "PDF «Мед. элементология в стоматологии», сл. 2, 4–7", "flag": "⚠ Стоматологический файл."}, {"id": "el71", "block": "b7", "question": "Какую роль играют Ca и P в эмали; что такое CPP-ACP?", "answer": "Ca — основной структурный элемент минерализованной эмали; минерализация зависит от элементного состава ротовой жидкости. CPP-ACP (казеинфосфопептид — аморфный фосфат кальция, Tooth Mousse) связывается с биоплёнкой, налётом, гидроксиапатитом и доставляет активные ионы кальция и фосфата. После фторлака «Бифлюид» прирост кариеса снизился, концентрация Ca и P в ротовой жидкости выросла.", "source": "PDF «Мед. элементология в стоматологии», сл. 12, 20, 46", "flag": "⚠ Стоматологический файл."}], "quiz": [{"id": "eq01", "block": "b0", "q": "Кто основатель научной школы «Медицинская элементология» и заведующий кафедрой?", "options": ["А.П. Авцын", "А.В. Скальный", "В.В. Ковальский", "А.П. Виноградов"], "correct": 1, "explain": "Скальный А.В. — заведующий кафедрой, основатель направления «Биоэлементология».", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 2"}, {"id": "eq02", "block": "b0", "q": "В какой книге Вернадский показал, что живые организмы — часть закономерной организованности?", "options": ["«Ноосфера»", "«Биосфера»", "«Геохимия»", "«Очерки геохимии почв»"], "correct": 1, "explain": "Книга «Биосфера».", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 6"}, {"id": "eq03", "block": "b0", "q": "Кого НЕТ в списке учёных, внёсших вклад в элементологию (сл. 4)?", "options": ["Г.А. Бабенко", "А.И. Венчиков", "И.П. Павлов", "В.В. Ковальский"], "correct": 2, "explain": "Список: Вернадский, Виноградов, Венчиков, Ковальский, Бабенко, Авцын.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 4"}, {"id": "eq04", "block": "b0", "q": "Вторичные биоэлементы — это…", "options": ["структурные C, H, N, O", "электролиты K, Na, Cl", "«омы»: металлом, протеом, геном…", "простые молекулы H2O, O2"], "correct": 2, "explain": "Вторичные — сложные компоненты биоэлементных систем, «омы».", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 16, 18"}, {"id": "eq05", "block": "b0", "q": "Какое свойство относится к биоэлементу, а не к химическому элементу?", "options": ["Существует в 2000–3000 минералах", "Количество не ограничено", "Процесс формирования необратим во времени", "Присутствует и вне биосферы"], "correct": 2, "explain": "Формирование биоэлемента необратимо; остальное — про хим. элемент.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 20–22"}, {"id": "eq06", "block": "b1", "q": "Сколько химических элементов насчитывают в организме человека?", "options": ["около 20–25", "около 40", "около 70–75", "все 118"], "correct": 2, "explain": "Около 70–75.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 26"}, {"id": "eq07", "block": "b1", "q": "Какую долю массы составляют органогены O, H, C, N?", "options": ["65%", "90%", "98%", "99,9%"], "correct": 2, "explain": "98%; макро 1,9%, микро 0,1%.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 26"}, {"id": "eq08", "block": "b1", "q": "Какой элемент — единственный в группе n·10⁰ (1–9% массы)?", "options": ["P", "Ca", "Mg", "Na"], "correct": 1, "explain": "n·10⁰ — Ca.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 31"}, {"id": "eq09", "block": "b1", "q": "К какой группе по содержанию относится Mg?", "options": ["Макроэлементы (n·10⁻²)", "Микроэлементы (n·10⁻³)", "Ультрамикроэлементы", "Органогены"], "correct": 0, "explain": "Mg — макроэлемент, 0,01–0,09%.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 31"}, {"id": "eq10", "block": "b1", "q": "Se, Cr, Co по классификации по содержанию — это…", "options": ["макроэлементы", "микроэлементы", "ультрамикроэлементы", "органогены"], "correct": 2, "explain": "n·10⁻⁶ и ниже — ультрамикроэлементы.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 31"}, {"id": "eq11", "block": "b1", "q": "Какой элемент эссенциален по Авцыну, но НЕ по ВОЗ 1996?", "options": ["Fe", "Zn", "Co", "I"], "correct": 2, "explain": "У Авцына эссенциальны Mn и Co, у ВОЗ — нет.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 32–33"}, {"id": "eq12", "block": "b1", "q": "Фтор по классификации Авцына относится к…", "options": ["эссенциальным", "условно эссенциальным", "токсичным", "органогенам"], "correct": 1, "explain": "F — условно эссенциальный у Авцына; у ВОЗ — в токсичных.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 32–33"}, {"id": "eq13", "block": "b1", "q": "В каком году ВОЗ предложила свою классификацию элементов?", "options": ["1962", "1976", "1996", "2008"], "correct": 2, "explain": "WHO, 1996.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 33"}, {"id": "eq14", "block": "b1", "q": "Признаки эссенциальности (1962) сформулировал…", "options": ["Д. Арнон", "Дж. Котциас", "E. Underwood", "H. Biesalski"], "correct": 2, "explain": "E. Underwood, 1962.", "source": "Офиц. лекция «Лекция 1 и 2_Введение_МС», сл. 34"}, {"id": "eq15", "block": "b1", "q": "Какой критерий принадлежит Котциасу?", "options": ["Элемент присутствует во всех здоровых тканях", "Увеличение в пище стимулирует рост", "Недостаток устраняется только этим элементом", "Корреляция низкого содержания и дефицита"], "correct": 0, "explain": "Котциас: присутствие во всех здоровых тканях const VERSION = "v1-2026-11-17";
const KEY = "elemColl.v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mem = {};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}CS.queue(k)}
function blank(){return {cards:{},quiz:{},mocks:[],set:{dent:false},v:1}}
let S = blank();
function load(){try{const x=JSON.parse(lsGet(KEY)||"null");S=Object.assign(blank(),x||{});S.set=Object.assign({dent:false},S.set||{})}catch(e){S=blank()}}
function save(){S.at=Date.now();lsSet(KEY,JSON.stringify(S))}
function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1800)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BN = Object.fromEntries(DATA.blocks);
const activeQ = () => DATA.questions.filter(q => S.set.dent || q.block !== "b7");
const activeZ = () => DATA.quiz.filter(q => S.set.dent || q.block !== "b7");

/* ---- Telegram CloudStorage sync (same scheme as chem-organic, own key) ---- */
const CS=(()=>{const SYNC_KEYS=[KEY],CHUNK=4000,dirty=new Set();let timer=null,ready=false;
const tg=()=>{try{return window.Telegram&&window.Telegram.WebApp}catch(e){return null}};
function api(){const w=tg();if(!w||!w.initData||!w.CloudStorage)return null;try{if(w.isVersionAtLeast&&!w.isVersionAtLeast("6.9"))return null}catch(e){return null}return w.CloudStorage}
const ck=k=>k.replace(/[^A-Za-z0-9_-]/g,"_").slice(0,120);
const p=(fn,...a)=>new Promise((res,rej)=>{try{fn(...a,(err,v)=>err?rej(err):res(v))}catch(e){rej(e)}});
async function read(c,k){const b=ck(k),n=parseInt(await p(c.getItem.bind(c),b+"_n"),10);if(!(n>0))return null;const names=Array.from({length:n},(_,i)=>b+"_"+i);const got=await p(c.getItems.bind(c),names);if(!got||names.some(x=>typeof got[x]!=="string"))throw new Error("incomplete");return names.map(x=>got[x]).join("")}
async function write(c,k,v){if(!v)return;const b=ck(k),parts=[];for(let i=0;i<v.length;i+=CHUNK)parts.push(v.slice(i,i+CHUNK));const old=parseInt(await p(c.getItem.bind(c),b+"_n"),10)||0;for(let i=0;i<parts.length;i++)await p(c.setItem.bind(c),b+"_"+i,parts[i]);await p(c.setItem.bind(c),b+"_n",String(parts.length));if(old>parts.length)await p(c.removeItems.bind(c),Array.from({length:old-parts.length},(_,i)=>b+"_"+(parts.length+i)));return true}
async function flush(){clearTimeout(timer);timer=null;const c=api();if(!c||!ready)return;const ks=[...dirty];dirty.clear();for(const k of ks){const v=lsGet(k);try{if(v)await write(c,k,v)}catch(e){dirty.add(k)}}}
function queue(k){if(!SYNC_KEYS.includes(k)||!api())return;dirty.add(k);if(ready){clearTimeout(timer);timer=setTimeout(flush,1500)}}
async function init(onChange){const c=api();if(!c)return false;let changed=false;for(const k of SYNC_KEYS){let cld;try{cld=await read(c,k)}catch(e){return false}const loc=lsGet(k),m=mergeState(loc,cld);if(m!=null&&m!==loc){try{localStorage.setItem(k,m)}catch(e){mem[k]=m}changed=true}if(lsGet(k))dirty.add(k)}ready=true;if(changed&&onChange)onChange();flush();return true}
return {queue,flush,init}})();
/* merge: per-item keep the record with more attempts; mocks = union by time. Returns string or null (= keep local). */
function mergeState(loc,cld){const J=x=>{try{return x?JSON.parse(x):null}catch(e){return null}};const L=J(loc),C=J(cld);if(!C)return null;if(!L)return cld;
const out=JSON.parse(JSON.stringify(L));let ch=false;out.cards=out.cards||{};out.quiz=out.quiz||{};out.mocks=out.mocks||[];
for(const g of ["cards","quiz"])for(const id in (C[g]||{})){const c=C[g][id],o=out[g][id];if(c&&(!o||(c.n||0)>(o.n||0))){out[g][id]=c;ch=true}}
const seen=new Set(out.mocks.map(m=>m.at));for(const m of (C.mocks||[]))if(m&&!seen.has(m.at)){out.mocks.push(m);ch=true}
out.mocks.sort((a,b)=>a.at-b.at);return ch?JSON.stringify(out):null}

/* ---- spaced repetition (Leitner-like): box 0..4; "не знал" → 0, "частично" → max(1,box-1)… ---- */
function cardW(id){const c=S.cards[id];if(!c)return 4;return [8,5,3,1.5,0.6][Math.min(c.box,4)]}
function grade(id,g){const c=S.cards[id]||{box:0,n:0,ok:0,part:0,no:0};c.n++;c.at=Date.now();
 if(g===2){c.ok++;c.box=Math.min(4,c.box+1)}else if(g===1){c.part++;c.box=Math.max(1,Math.min(c.box,2))}else{c.no++;c.box=0}
 c.last=g;S.cards[id]=c;save()}
function pickWeighted(pool,n){const res=[];pool=pool.slice();while(res.length<n&&pool.length){const tot=pool.reduce((s,q)=>s+cardW(q.id),0);let r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=cardW(pool[i].id);if(r<=0)break}i=Math.min(i,pool.length-1);res.push(pool.splice(i,1)[0])}return res}
function blockStats(b){const qs=DATA.questions.filter(q=>q.block===b);const known=qs.filter(q=>(S.cards[q.id]||{}).box>=2).length;return {n:qs.length,known}}

/* ---- screens ---- */
let SES=null;
function home(){SES=null;const qs=activeQ();const known=qs.filter(q=>(S.cards[q.id]||{}).box>=2).length;
 const last=S.mocks[S.mocks.length-1];
 let h=`<h1>⚛️ Элементология · коллоквиум №1</h1><div class="mut">По офиц. лекции «Лекция 1 и 2_Введение_МС» (каф. Скального) + 3 PDF. ⚠ — неточно / может не входить.</div>
 <div class="card"><div class="blk"><span>Выучено карточек</span><b>${known} / ${qs.length}</b></div><div class="bar"><i style="width:${qs.length?known*100/qs.length:0}%"></i></div>
 ${last?`<div class="mut" style="margin-top:8px">Последний пробный: ${last.score}/${last.max}${last.weak&&last.weak.length?" · слабое: "+last.weak.map(b=>esc(BN[b]||b)).join(", "):""}</div>`:""}</div>
 <button id="mCards">🃏 Карточки (вспомни → проверь)</button>
 <button id="mQuiz">⚡ Быстрый тест</button>
 <button id="mMock">🎤 Пробный коллоквиум (5 вопросов)</button>
 <label class="tg"><input type="checkbox" id="dent" ${S.set.dent?"checked":""}> включить блок «Стоматология» ⚠</label>
 <h2>Блоки (в её порядке)</h2><div class="card">`;
 for(const [b,name] of DATA.blocks){if(b==="b7"&&!S.set.dent)continue;const st=blockStats(b);h+=`<div class="blk"><span>${esc(name)}</span><span class="mut">${st.known}/${st.n}</span><button class="sec" style="width:auto;margin:0;padding:6px 10px" data-b="${b}">учить</button></div>`}
 h+=`</div><button class="sec" id="reset">Сбросить прогресс этой игры</button><div class="mut">Версия ${VERSION}. Прогресс сохраняется в Telegram.</div>`;
 $("#app").innerHTML=h;
 $("#mCards").onclick=()=>startCards(null);$("#mQuiz").onclick=startQuiz;$("#mMock").onclick=startMock;
 $("#dent").onchange=e=>{S.set.dent=e.target.checked;save();home()};
 document.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>startCards(x.dataset.b));
 $("#reset").onclick=()=>{if(confirm("Сбросить прогресс элементологии? Другие игры не затрагиваются.")){const d=S.set.dent;S=blank();S.set.dent=d;save();home()}};
 window.scrollTo(0,0)}

function cardHtml(q,reveal){return `<span class="pill">${esc(BN[q.block])}</span><div class="q">${esc(q.question)}</div>`+
 (reveal?`<div class="ans">${esc(q.answer)}</div><div class="src">📎 ${esc(q.source)}</div>${q.flag?`<div class="flag">⚠ ${esc(q.flag)}</div>`:""}`:"")}

function startCards(block){const pool=block?DATA.questions.filter(q=>q.block===block):activeQ();
 SES={type:"cards",queue:pickWeighted(pool,Math.min(10,pool.length)),done:0,res:{2:0,1:0,0:0}};showCard(false)}
function showCard(rev){const q=SES.queue[0];if(!q)return cardsEnd();
 $("#app").innerHTML=`<div class="mut">Карточка ${SES.done+1} · осталось ${SES.queue.length}</div><div class="card">${cardHtml(q,rev)}</div>`+
 (rev?`<div class="mut">Как ответил?</div><div class="row"><button class="bad" data-g="0">Не знал</button><button class="mid" data-g="1">Частично</button><button class="ok" data-g="2">Знал</button></div>`
 :`<div class="mut">Ответь вслух по схеме: определение → классификация (кто, когда) → механизм → болезнь → диагностика.</div><button id="show">Показать ответ</button>`)+`<button class="sec" id="exit">Выйти</button>`;
 if(rev)document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=+b.dataset.g;grade(q.id,g);SES.res[g]++;SES.done++;SES.queue.shift();
   if(g===0)SES.queue.splice(Math.min(2,SES.queue.length),0,q);else if(g===1)SES.queue.push(q);showCard(false)});
 else $("#show").onclick=()=>showCard(true);
 $("#exit").onclick=home;window.scrollTo(0,0)}
function cardsEnd(){$("#app").innerHTML=`<h1>Готово 👍</h1><div class="card"><div class="blk"><span>Знал</span><b>${SES.res[2]}</b></div><div class="blk"><span>Частично</span><b>${SES.res[1]}</b></div><div class="blk"><span>Не знал</span><b>${SES.res[0]}</b></div><div class="mut">«Не знал» будут попадаться чаще.</div></div><button id="again">Ещё 10 карточек</button><button class="sec" id="home">На главную</button>`;
 $("#again").onclick=()=>startCards(null);$("#home").onclick=home}

function startQuiz(){const qs=shuffle(activeZ()).slice(0,10).map(q=>{const order=shuffle(q.options.map((_,i)=>i));return Object.assign({},q,{order})});SES={type:"quiz",qs,i:0,ok:0,wrong:[]};showQuiz()}
function showQuiz(){const q=SES.qs[SES.i];if(!q)return quizEnd();
 $("#app").innerHTML=`<div class="mut">Вопрос ${SES.i+1}/${SES.qs.length} · верно ${SES.ok}</div><div class="card"><span class="pill">${esc(BN[q.block])}</span><div class="q">${esc(q.q)}</div></div>`+
 q.order.map(i=>`<button class="opt" data-i="${i}">${esc(q.options[i])}</button>`).join("")+`<div id="fb"></div><button class="sec" id="exit">Выйти</button>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(SES.answered)return;SES.answered=true;const i=+b.dataset.i,ok=i===q.correct;
  document.querySelectorAll(".opt").forEach(x=>{if(+x.dataset.i===q.correct)x.classList.add("right")});if(!ok){b.classList.add("wrong");SES.wrong.push(q)}else SES.ok++;
  const r=S.quiz[q.id]||{n:0,ok:0};r.n++;if(ok)r.ok++;r.at=Date.now();S.quiz[q.id]=r;save();
  $("#fb").innerHTML=`<div class="card">${ok?"✅ Верно":"❌ Неверно"}. ${esc(q.explain)}<div class="src">📎 ${esc(q.source)}</div></div><button id="next">Дальше</button>`;
  $("#next").onclick=()=>{SES.answered=false;SES.i++;showQuiz()}});
 $("#exit").onclick=home;window.scrollTo(0,0)}
function quizEnd(){$("#app").innerHTML=`<h1>Тест: ${SES.ok}/${SES.qs.length}</h1>`+(SES.wrong.length?`<div class="card"><b>Повтори:</b>${SES.wrong.map(q=>`<div class="blk"><span>${esc(q.q)}<br><span class="mut">→ ${esc(q.options[q.correct])} · ${esc(q.source)}</span></span></div>`).join("")}</div>`:`<div class="card">Без ошибок 🔥</div>`)+
 `<button id="again">Ещё тест</button><button class="sec" id="home">На главную</button>`;$("#again").onclick=startQuiz;$("#home").onclick=home}

function startMock(){const pool=activeQ();const byB={};for(const q of pool)(byB[q.block]=byB[q.block]||[]).push(q);
 const bl=shuffle(Object.keys(byB));const picked=[];for(const b of bl){if(picked.length>=5)break;picked.push(pickWeighted(byB[b],1)[0])}
 while(picked.length<5&&picked.length<pool.length){const r=pickWeighted(pool.filter(q=>!picked.includes(q)),1)[0];if(!r)break;picked.push(r)}
 const order=DATA.blocks.map(x=>x[0]);picked.sort((a,b)=>order.indexOf(a.block)-order.indexOf(b.block));
 SES={type:"mock",qs:picked,i:0,g:[],t0:Date.now()};showMock(false)}
function showMock(rev){const q=SES.qs[SES.i];if(!q)return mockEnd();
 $("#app").innerHTML=`<div class="mut">Пробный коллоквиум · вопрос ${SES.i+1}/${SES.qs.length}</div><div class="card">${cardHtml(q,rev)}</div>`+
 (rev?`<div class="mut">Оцени свой устный ответ честно:</div><div class="row"><button class="bad" data-g="0">0 — не ответил</button><button class="mid" data-g="1">1 — частично</button><button class="ok" data-g="2">2 — полно</button></div>`
 :`<div class="mut">Ответь вслух 1–2 минуты, как преподавателю. Потом сверь с эталоном.</div><button id="show">Я ответил — показать эталон</button>`)+`<button class="sec" id="exit">Прервать</button>`;
 if(rev)document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=+b.dataset.g;SES.g.push(g);grade(q.id,g);SES.i++;showMock(false)});
 else $("#show").onclick=()=>showMock(true);
 $("#exit").onclick=home;window.scrollTo(0,0)}
function mockEnd(){const score=SES.g.reduce((a,b)=>a+b,0),max=SES.qs.length*2;const weak=[...new Set(SES.qs.filter((q,i)=>SES.g[i]<2).map(q=>q.block))];
 S.mocks.push({at:Date.now(),score,max,weak});if(S.mocks.length>50)S.mocks=S.mocks.slice(-50);save();
 const pct=max?Math.round(score*100/max):0;
 $("#app").innerHTML=`<h1>Итог: ${score}/${max} (${pct}%)</h1><div class="card">${SES.qs.map((q,i)=>`<div class="blk"><span>${esc(q.question)}<br><span class="mut">${esc(BN[q.block])}</span></span><b>${["❌","🟡","✅"][SES.g[i]]}</b></div>`).join("")}</div>`+
 (weak.length?`<div class="card"><b>Слабые блоки:</b><br>${weak.map(b=>`• ${esc(BN[b])}`).join("<br>")}</div>`+weak.map(b=>`<button class="sec" data-b="${b}">Учить: ${esc(BN[b])}</button>`).join(""):`<div class="card">Все 5 вопросов — полно. Так держать!</div>`)+
 `<button id="again">Ещё пробный</button><button class="sec" id="home">На главную</button>`;
 document.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>startCards(x.dataset.b));$("#again").onclick=startMock;$("#home").onclick=home}

const hadController=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
 window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});let pending=false,reloaded=false;
  const reloadNow=()=>{if(reloaded)return;reloaded=true;try{save()}catch(e){}location.reload()};
  const tryReload=()=>{if(pending&&!SES)reloadNow()};
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadController)return;pending=true;tryReload()});
  document.addEventListener("visibilitychange",()=>{if(pending&&document.hidden)reloadNow()});
  document.addEventListener("click",()=>setTimeout(tryReload,0))})}
document.addEventListener("visibilitychange",()=>{if(document.hidden)CS.flush()});
window.addEventListener("pagehide",()=>CS.flush());
load();home();
try{const w=window.Telegram&&window.Telegram.WebApp;if(w&&w.ready){w.ready();w.expand&&w.expand()}}catch(e){}
CS.init(()=>{if(SES)return;load();home();toast("Прогресс синхронизирован")});
</script>
